# Tiny Tapeout project information
project:
  title:        "4x4 integer systolic GEMM"
  author:       "Sahpar Nil Ozer, Hasan Unlu"
  discord:      ""
  description:  "4x4 int8 systolic GEMM with a data preparation unit: int8 or BF16 (real) operands, FP32 or int32 results, accumulate mode; hosts tile any-size matmuls onto it."
  language:     "SystemVerilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  tiles: "6x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sahpar_gemm4x4"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_sahpar_gemm4x4.sv"
    - "rx_byte_interface.sv"
    - "tx_byte_interface.sv"
    - "cmd_decoder.sv"
    - "gemm_top.sv"
    - "systolic_array.sv"
    - "pe.sv"
    - "mac_unit.sv"
    - "data_prep_unit.sv"
    - "int_to_fp32.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "RX_DATA[0]"
  ui[1]: "RX_DATA[1]"
  ui[2]: "RX_DATA[2]"
  ui[3]: "RX_DATA[3]"
  ui[4]: "RX_DATA[4]"
  ui[5]: "RX_DATA[5]"
  ui[6]: "RX_DATA[6]"
  ui[7]: "RX_DATA[7]"

  # Outputs
  uo[0]: "TX_DATA[0]"
  uo[1]: "TX_DATA[1]"
  uo[2]: "TX_DATA[2]"
  uo[3]: "TX_DATA[3]"
  uo[4]: "TX_DATA[4]"
  uo[5]: "TX_DATA[5]"
  uo[6]: "TX_DATA[6]"
  uo[7]: "TX_DATA[7]"

  # Bidirectional pins
  uio[0]: "RX_VALID"
  uio[1]: "RX_READY"
  uio[2]: "TX_READY"
  uio[3]: "TX_VALID"
  uio[4]: "BUSY"
  uio[5]: "DONE"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
